<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Airplane Shooter - Derriba Aviones</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        #cameraView {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: -1;
        }

        #container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 10px;
            z-index: 100;
            font-size: 18px;
        }

        #score {
            font-size: 24px;
            font-weight: bold;
            color: #ffff00;
        }

        #startButton {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 20px 40px;
            font-size: 24px;
            background: #ff4444;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            z-index: 101;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        #startButton:hover {
            background: #ff6666;
        }

        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 40px;
            height: 40px;
            pointer-events: none;
            z-index: 99;
            transition: transform 0.15s ease-out, filter 0.15s ease-out;
        }

        #crosshair::before,
        #crosshair::after {
            content: '';
            position: absolute;
            background: rgba(255, 0, 0, 0.8);
        }

        #crosshair::before {
            width: 2px;
            height: 100%;
            left: 50%;
            transform: translateX(-50%);
        }

        #crosshair::after {
            width: 100%;
            height: 2px;
            top: 50%;
            transform: translateY(-50%);
        }

        #message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            background: rgba(0, 0, 0, 0.8);
            padding: 20px 40px;
            border-radius: 10px;
            font-size: 20px;
            display: none;
            z-index: 102;
        }
    </style>
</head>
<body>
    <video id="cameraView" autoplay playsinline></video>
    <div id="container"></div>

    <div id="info">
        <div>Puntuación: <span id="score">0</span></div>
        <div>Aviones derribados: <span id="hits">0</span></div>
        <div>Tiempo: <span id="time">0</span>s</div>
    </div>

    <div id="crosshair"></div>
    <div id="message"></div>
    <button id="startButton">Iniciar AR</button>

    <script type="module">
        import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.157.0/build/three.module.js';
        import { DeviceOrientationControls } from 'https://cdn.jsdelivr.net/npm/three@0.157.0/examples/jsm/controls/DeviceOrientationControls.js';

        let camera, scene, renderer;
        let airplanes = [];
        let score = 0;
        let hits = 0;
        let startTime = 0;
        let isPlaying = false;
        let raycaster, pointer;
        let videoElement;
        let controls; // Controles de orientación

        const container = document.getElementById('container');
        const startButton = document.getElementById('startButton');
        const scoreElement = document.getElementById('score');
        const hitsElement = document.getElementById('hits');
        const timeElement = document.getElementById('time');
        const messageElement = document.getElementById('message');
        videoElement = document.getElementById('cameraView');

        // Solicitar permisos de sensores de movimiento (requerido en iOS 13+)
        async function requestMotionPermission() {
            if (typeof DeviceOrientationEvent !== 'undefined' &&
                typeof DeviceOrientationEvent.requestPermission === 'function') {
                try {
                    const permission = await DeviceOrientationEvent.requestPermission();
                    if (permission === 'granted') {
                        console.log('Permisos de orientación concedidos');
                        return true;
                    } else {
                        showMessage('Se necesitan permisos de sensores de movimiento', 3000);
                        return false;
                    }
                } catch (error) {
                    console.error('Error al solicitar permisos de orientación:', error);
                    return false;
                }
            }
            // Si no requiere permisos explícitos (Android), retornar true
            return true;
        }

        // Inicializar cámara del dispositivo
        async function initCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: 'environment', // Cámara trasera
                        width: { ideal: 1920 },
                        height: { ideal: 1080 }
                    }
                });
                videoElement.srcObject = stream;
                videoElement.play();
                console.log('Cámara iniciada correctamente');
                return true;
            } catch (error) {
                console.error('Error al acceder a la cámara:', error);
                showMessage('Error: No se puede acceder a la cámara. Por favor, permite el acceso.', 3000);
                return false;
            }
        }

        // Inicializar la escena
        function init() {
            // Escena
            scene = new THREE.Scene();
            // Sin fondo para permitir transparencia y ver la cámara
            scene.background = null;

            // Cámara
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 1.6, 0); // Altura de ojos humanos

            // Renderer con transparencia
            renderer = new THREE.WebGLRenderer({
                antialias: true,
                alpha: true // Habilitar transparencia
            });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.xr.enabled = true;
            renderer.domElement.style.position = 'absolute';
            renderer.domElement.style.top = '0';
            renderer.domElement.style.left = '0';
            container.appendChild(renderer.domElement);

            // Luces
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(10, 20, 10);
            scene.add(directionalLight);

            // Raycaster para detectar clics
            raycaster = new THREE.Raycaster();
            pointer = new THREE.Vector2(0, 0); // Centro de la pantalla

            // Inicializar controles de orientación del dispositivo
            controls = new DeviceOrientationControls(camera);
            controls.connect();

            // Event listeners
            window.addEventListener('resize', onWindowResize);
            window.addEventListener('click', onShoot);
            window.addEventListener('touchstart', onShoot);

            startButton.addEventListener('click', startAR);
        }

        // Crear un avión
        function createAirplane() {
            const airplane = new THREE.Group();

            // Cuerpo del avión (más grande y más visible)
            const bodyGeometry = new THREE.CylinderGeometry(0.25, 0.25, 2.5, 8);
            const bodyMaterial = new THREE.MeshPhongMaterial({
                color: 0xff0000,
                emissive: 0x330000 // Luz propia para mayor visibilidad
            });
            const body = new THREE.Mesh(bodyGeometry, bodyMaterial);
            body.rotation.z = Math.PI / 2;
            airplane.add(body);

            // Alas (más grandes)
            const wingGeometry = new THREE.BoxGeometry(3.5, 0.08, 0.8);
            const wingMaterial = new THREE.MeshPhongMaterial({
                color: 0xffff00,
                emissive: 0x333300
            });
            const wings = new THREE.Mesh(wingGeometry, wingMaterial);
            wings.position.y = 0;
            airplane.add(wings);

            // Cola (más grande)
            const tailGeometry = new THREE.BoxGeometry(0.15, 0.8, 0.5);
            const tailMaterial = new THREE.MeshPhongMaterial({
                color: 0xffff00,
                emissive: 0x333300
            });
            const tail = new THREE.Mesh(tailGeometry, tailMaterial);
            tail.position.x = -1.25;
            tail.position.y = 0.4;
            airplane.add(tail);

            // Propulsor (nariz) más grande
            const noseGeometry = new THREE.ConeGeometry(0.25, 0.5, 8);
            const noseMaterial = new THREE.MeshPhongMaterial({
                color: 0x333333,
                emissive: 0x111111
            });
            const nose = new THREE.Mesh(noseGeometry, noseMaterial);
            nose.rotation.z = -Math.PI / 2;
            nose.position.x = 1.5;
            airplane.add(nose);

            // Posición aleatoria
            const angle = Math.random() * Math.PI * 2;
            const distance = 10 + Math.random() * 10;
            const height = 2 + Math.random() * 8;

            airplane.position.x = Math.cos(angle) * distance;
            airplane.position.y = height;
            airplane.position.z = Math.sin(angle) * distance;

            // Rotación para apuntar hacia el centro
            airplane.lookAt(0, height, 0);

            // Velocidad
            airplane.userData.velocity = new THREE.Vector3(
                -Math.cos(angle) * 0.02,
                0,
                -Math.sin(angle) * 0.02
            );

            // Movimiento aleatorio
            airplane.userData.wobble = {
                time: Math.random() * 100,
                speedY: 0.3 + Math.random() * 0.5,
                speedZ: 0.2 + Math.random() * 0.3,
                amplitudeY: 0.5,
                amplitudeZ: 0.3
            };

            scene.add(airplane);
            airplanes.push(airplane);
        }

        // Iniciar AR
        async function startAR() {
            // Primero iniciar la cámara
            showMessage('Solicitando acceso a la cámara...', 2000);
            const cameraStarted = await initCamera();

            if (!cameraStarted) {
                return; // No continuar si no se puede acceder a la cámara
            }

            // Solicitar permisos de sensores de movimiento
            showMessage('Solicitando permisos de sensores...', 2000);
            const motionPermission = await requestMotionPermission();

            if (!motionPermission) {
                showMessage('⚠️ Sin sensores de movimiento. Usa el modo táctil.', 3000);
            }

            // Pequeña demora para que la cámara se estabilice
            await new Promise(resolve => setTimeout(resolve, 500));

            if (navigator.xr) {
                try {
                    const supported = await navigator.xr.isSessionSupported('immersive-ar');
                    if (supported) {
                        showMessage('Iniciando modo AR...', 2000);
                        const session = await navigator.xr.requestSession('immersive-ar', {
                            requiredFeatures: ['local-floor'],
                            optionalFeatures: ['dom-overlay'],
                            domOverlay: { root: document.body }
                        });
                        renderer.xr.setSession(session);
                        startButton.style.display = 'none';
                        startGame();
                    } else {
                        // Si AR no está soportado, iniciar en modo normal con cámara
                        console.log('AR no soportado, iniciando en modo normal con cámara');
                        showMessage('Modo AR no disponible. Usando cámara estándar.', 2000);
                        startButton.style.display = 'none';
                        startGame();
                    }
                } catch (error) {
                    console.error('Error al iniciar AR:', error);
                    showMessage('Error al iniciar AR. Usando cámara estándar.', 2000);
                    // Iniciar en modo normal si hay error
                    startButton.style.display = 'none';
                    startGame();
                }
            } else {
                // Si WebXR no está disponible, iniciar en modo normal con cámara
                console.log('WebXR no disponible, iniciando en modo normal con cámara');
                showMessage('WebXR no disponible. Usando cámara estándar.', 2000);
                startButton.style.display = 'none';
                startGame();
            }
        }

        // Iniciar el juego
        function startGame() {
            isPlaying = true;
            startTime = Date.now();

            // Crear aviones iniciales
            for (let i = 0; i < 5; i++) {
                setTimeout(() => createAirplane(), i * 1000);
            }

            // Generar nuevos aviones periódicamente
            setInterval(() => {
                if (isPlaying && airplanes.length < 10) {
                    createAirplane();
                }
            }, 3000);
        }

        // Crear efecto de explosión
        function createExplosion(position) {
            const explosionGroup = new THREE.Group();

            // Crear partículas de explosión
            for (let i = 0; i < 12; i++) {
                const particleGeometry = new THREE.SphereGeometry(0.15, 8, 8);
                const particleMaterial = new THREE.MeshPhongMaterial({
                    color: Math.random() > 0.5 ? 0xff6600 : 0xffff00,
                    emissive: 0xff3300
                });
                const particle = new THREE.Mesh(particleGeometry, particleMaterial);

                // Velocidad aleatoria para cada partícula
                particle.userData.velocity = new THREE.Vector3(
                    (Math.random() - 0.5) * 0.3,
                    (Math.random() - 0.5) * 0.3,
                    (Math.random() - 0.5) * 0.3
                );

                explosionGroup.add(particle);
            }

            explosionGroup.position.copy(position);
            scene.add(explosionGroup);

            // Animar explosión
            let frame = 0;
            const explosionInterval = setInterval(() => {
                frame++;
                explosionGroup.children.forEach(particle => {
                    particle.position.add(particle.userData.velocity);
                    particle.scale.multiplyScalar(0.9);
                });

                if (frame > 20) {
                    clearInterval(explosionInterval);
                    scene.remove(explosionGroup);
                }
            }, 30);
        }

        // Pulsar cruz de mira
        function pulseCrosshair(hit) {
            const crosshair = document.getElementById('crosshair');
            crosshair.style.transform = 'translate(-50%, -50%) scale(1.5)';
            crosshair.style.filter = hit ? 'drop-shadow(0 0 10px #00ff00)' : 'drop-shadow(0 0 5px #ff0000)';

            setTimeout(() => {
                crosshair.style.transform = 'translate(-50%, -50%) scale(1)';
                crosshair.style.filter = 'none';
            }, 150);
        }

        // Disparar
        function onShoot(event) {
            if (!isPlaying) return;

            event.preventDefault();

            // Raycaster desde el centro de la pantalla
            raycaster.setFromCamera(pointer, camera);

            // Detectar intersecciones
            const intersects = raycaster.intersectObjects(airplanes, true);

            if (intersects.length > 0) {
                // Encontrar el avión padre
                let airplane = intersects[0].object;
                while (airplane.parent && airplane.parent !== scene) {
                    airplane = airplane.parent;
                }

                // Eliminar el avión
                const index = airplanes.indexOf(airplane);
                if (index > -1) {
                    // Crear explosión en la posición del avión
                    createExplosion(airplane.position);

                    airplanes.splice(index, 1);
                    scene.remove(airplane);

                    // Actualizar puntuación
                    score += 100;
                    hits++;
                    scoreElement.textContent = score;
                    hitsElement.textContent = hits;

                    // Efectos visuales
                    pulseCrosshair(true);
                    showMessage('¡IMPACTO! 💥 +100', 500);

                    // Crear un nuevo avión
                    setTimeout(createAirplane, 2000);
                }
            } else {
                // Fallo - feedback visual
                pulseCrosshair(false);
            }
        }

        // Mostrar mensaje temporal
        function showMessage(text, duration) {
            messageElement.textContent = text;
            messageElement.style.display = 'block';
            setTimeout(() => {
                messageElement.style.display = 'none';
            }, duration);
        }

        // Actualizar aviones
        function updateAirplanes() {
            airplanes.forEach((airplane, index) => {
                // Mover hacia adelante
                airplane.position.add(airplane.userData.velocity);

                // Movimiento ondulante
                const wobble = airplane.userData.wobble;
                wobble.time += 0.01;
                airplane.position.y += Math.sin(wobble.time * wobble.speedY) * wobble.amplitudeY * 0.01;
                airplane.rotation.z = Math.sin(wobble.time * wobble.speedZ) * wobble.amplitudeZ * 0.1;

                // Eliminar si está muy lejos o muy cerca
                const distance = airplane.position.length();
                if (distance > 50 || distance < 2) {
                    scene.remove(airplane);
                    airplanes.splice(index, 1);
                    // Crear un nuevo avión para reemplazarlo
                    setTimeout(createAirplane, 1000);
                }
            });
        }

        // Actualizar tiempo
        function updateTime() {
            if (isPlaying) {
                const elapsed = Math.floor((Date.now() - startTime) / 1000);
                timeElement.textContent = elapsed;
            }
        }

        // Animación
        function animate() {
            renderer.setAnimationLoop(() => {
                // Actualizar controles de orientación
                if (controls) {
                    controls.update();
                }

                updateAirplanes();
                updateTime();
                renderer.render(scene, camera);
            });
        }

        // Redimensionar ventana
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // Iniciar
        init();
        animate();
    </script>
</body>
</html>
